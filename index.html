function saveCanvas(c){c.toBlob(async b=>{if(!b)return;const file=new File([b],'chip-21.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'For Chip ✦'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chip-21.jpg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)},'image/jpeg',.92)}

/* ------------------------------- loop ------------------------------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  VH=2*60*Math.tan(THREE.MathUtils.degToRad(25));VW=VH*camera.aspect;uni.uScale.value=innerHeight*PR*.5;if(composer)composer.setSize(innerWidth,innerHeight);trailResize()}
addEventListener('resize',()=>{resize();if(S&&S.placeFlames)S.placeFlames()});resize();
let tp=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-tp)/1000);tp=now;st+=dt;uni.uTime.value=now*.001;
  readHands();gestures(dt);heartGesture(dt);if(S.update)S.update(dt);
  if(ASM.on){ASM.t+=dt*ASM.speed;if(ASM.t>ASM.end+.4){ASM.on=false;ASM.ink=null;phys(ASM.after)}}
  if(GAL.on&&GAL.rot&&!ASM.on){const a=GAL.rot*dt,c=Math.cos(a),s=Math.sin(a),R=GAL.ratio||1,oy=GAL.oy;for(let i=0;i<N;i++){const j=i*3,X=tgt[j],Y=(tgt[j+1]-oy)/R;tgt[j]=X*c-Y*s;tgt[j+1]=(X*s+Y*c)*R+oy}}
  const t=now*.001,img=uni.uImg.value,hf=1-.55*img,fr=Math.min(3,dt*60),dmp=Math.pow(DAMP,fr),cl=1-Math.pow(.97,fr),Kf=K*fr,AON=ASM.on,AT=ASM.t,nzf=.004*hf*fr*NZ;
  for(let i=0;i<N;i++){const j=i*3;const x=pos[j],y=pos[j+1],z=pos[j+2];
    let gx=tgt[j],gy=tgt[j+1],gz=tgt[j+2];
    if(AON){const u=(AT-dly[i])/dur[i];
      if(u<=0){gx=p0[j];gy=p0[j+1];gz=p0[j+2]}
      else if(u<1){const e=u<.5?4*u*u*u:1-(-2*u+2)*(-2*u+2)*(-2*u+2)/2,a=1-e,b0=a*a,b1=2*a*e,b2=e*e;
        gx=b0*p0[j]+b1*cp[j]+b2*gx;gy=b0*p0[j+1]+b1*cp[j+1]+b2*gy;gz=b0*p0[j+2]+b1*cp[j+2]+b2*gz;
        const w=Math.sin(u*3.1416)*.5;gx+=Math.sin(u*9+seed[i]*40)*w;gy+=Math.cos(u*7+seed[i]*30)*w}
      const cu=u<.55?0:u>1?1:(u-.55)/.45,ce=cu*cu*(3-2*cu),fl=1+.7*Math.max(0,1-Math.abs(u-1)/.18);
      col[j]=(c0[j]+(tcol[j]-c0[j])*ce)*fl;col[j+1]=(c0[j+1]+(tcol[j+1]-c0[j+1])*ce)*fl;col[j+2]=(c0[j+2]+(tcol[j+2]-c0[j+2])*ce)*fl}
    let ax=(gx-x)*Kf,ay=(gy-y)*Kf,az=(gz-z)*Kf;
    if(swirl){ax-=y*swirl*.004*fr;ay+=x*swirl*.004*fr}
    for(let h=0;h<(S.ready===false?0:hands.length);h++){const H=hands[h];if(H.fist||H.pinch)continue;const dx=x-H.wx,dy=y-H.wy,d2=dx*dx+dy*dy;
      if(d2<36){const d=Math.sqrt(d2)+.3,f=(1-d/6)*.55*hf*fr;ax+=dx/d*f-dy/d*f*.9;ay+=dy/d*f+dx/d*f*.9}}
    ax+=Math.sin(t*.7+seed[i]*40)*nzf;ay+=Math.cos(t*.6+seed[i]*30)*nzf;
    vel[j]=(vel[j]+ax)*dmp;vel[j+1]=(vel[j+1]+ay)*dmp;vel[j+2]=(vel[j+2]+az)*dmp;
    pos[j]=x+vel[j]*fr;pos[j+1]=y+vel[j+1]*fr;pos[j+2]=z+vel[j+2]*fr;
    if(!AON){col[j]+=(tcol[j]-col[j])*cl;col[j+1]+=(tcol[j+1]-col[j+1])*cl;col[j+2]+=(tcol[j+2]-col[j+2])*cl}}
  geo.attributes.position.needsUpdate=true;geo.attributes.aColor.needsUpdate=true;
  uni.uImg.value+=(modeImg-uni.uImg.value)*(1-Math.pow(.95,fr));uni.uOpacity.value+=(opT-uni.uOpacity.value)*(1-Math.pow(.94,fr));bloomCur+=(bloomBase-bloomCur)*(1-Math.pow(.95,fr));if(SF)SF.material.opacity+=(sfT-SF.material.opacity)*(1-Math.pow(.97,fr));
  const h=hands[0];const rx=h?(h.sx/innerWidth-.5)*.08:0,ry=h?(h.sy/innerHeight-.5)*.06:0;
  const pr=S.name==='sky'?0:1;pts.rotation.y+=(rx*pr-pts.rotation.y)*.03;pts.rotation.x+=(ry*pr-pts.rotation.x)*.03;
  drawTrail();
  if(composer&&!boothOn){uni.uLin.value=1;bloom.strength=bloomCur*(1-.72*uni.uImg.value);composer.render()}else{uni.uLin.value=0;renderer.render(scene,camera)}
  if(wantShot){wantShot=false;S.shot&&S.shot()}
  requestAnimationFrame(loop)}

/* ------------------------------- boot ------------------------------- */
galaxy();setColors(pinkMix);swirl=.3;requestAnimationFrame(loop);
[...CFG.photos.map(p=>p.src),CFG.bestPhoto,...CFG.framePhotos].forEach(loadImg);
setTimeout(()=>loadHands(),700);
if(!isMobile)(async()=>{try{
  const [{EffectComposer},{RenderPass},{UnrealBloomPass}]=await Promise.all([import('three/addons/postprocessing/EffectComposer.js'),import('three/addons/postprocessing/RenderPass.js'),import('three/addons/postprocessing/UnrealBloomPass.js')]);
  const c=new EffectComposer(renderer);c.setPixelRatio(PR);c.addPass(new RenderPass(scene,camera));
  const b=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.62,.42,.32);c.addPass(b);c.setSize(innerWidth,innerHeight);
  bloom=b;composer=c;CLEAR=0x000000;if(!boothOn)renderer.setClearColor(CLEAR,1);log('bloom on')}catch(e){console.warn('[chip] bloom off',e)}})();

async function begin(useCam){
  const camP=useCam?startCamera():Promise.resolve(false);
  sfx.init();
  const intro=$('intro');intro.style.opacity=0;intro.style.pointerEvents='none';setTimeout(()=>intro.remove(),1400);
  $('hud').classList.add('on');camSettled=!useCam;camP.finally(()=>{camSettled=true});
  const fontsP=document.fonts?Promise.race([Promise.all(['300 100px Fraunces','italic 300 100px Fraunces','400 100px Fraunces','italic 400 100px Fraunces','600 124px Fraunces'].map(f=>document.fonts.load(f,'Chào công chúa Sinh nhật vui nha ơưữệạảầ 21'))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}):Promise.resolve();
  if(useCam)await Promise.race([camP,new Promise(r=>setTimeout(r,1500))]);else status(COPY.stTap,3500);
  await fontsP;
  const q=new URLSearchParams(location.search).get('scene');const qi=q==null?0:(isNaN(+q)?scenes.findIndex(s=>s.name===q):+q);
  go(Math.max(0,qi));
}
$('goCam').onclick=e=>{e.stopPropagation();$('goCam').textContent='đang mở…';$('goCam').disabled=true;begin(true)};
$('goTap').onclick=e=>{e.stopPropagation();begin(false)};
