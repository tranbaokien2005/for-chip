   this.nC=Math.floor(N*.55);for(let i=this.nC;i<N;i++){const a=Math.random()*6.283,e=Math.random();

   for(let i=0;i<this.nC;i++){const p=CROWN[Math.floor(i*CROWN.length/this.nC)];tcol[i*3]=p[2];tcol[i*3+1]=p[3];tcol[i*3+2]=p[4]}
   later(1800,()=>{if(S===this){$('booth').classList.add('on');$('boothHint').textContent='tap to snap'}})},

   if(faceDet&&video.readyState>=2){frameN++;if(frameN%2===0||!this.fx){try{const r=faceDet.detectForVideo(video,performance.now());const d=r&&r.detections&&r.detections[0];
       if(d){const b=d.boundingBox,vw=video.videoWidth,vh=video.videoHeight,[x1,y1]=cover(b.originX/vw,b.originY/vh),[x2]=cover((b.originX+b.width)/vw,b.originY/vh),w=Math.abs(x2-x1);let ang=0;
         const kp=d.keypoints;if(kp&&kp.length>1){const [ax,ay]=cover(kp[0].x,kp[0].y),[bx,by]=cover(kp[1].x,kp[1].y);ang=Math.atan2(by-ay,bx-ax);if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI}
         this.face={x:(x1+x2)/2,y:y1-w*.34,w:w*1.18,a:Math.max(-.6,Math.min(.6,ang)),t:performance.now()}}}catch(e){}}}
   let ta=0;if(this.face&&performance.now()-this.face.t<1500){tx=this.face.x;ty=this.face.y;tw=this.face.w;ta=this.face.a||0}
   if(!this.fx)this.fx={x:tx,y:ty,w:tw,a:0};const f=this.fx;f.x+=(tx-f.x)*.3;f.y+=(ty-f.y)*.3;f.w+=(tw-f.w)*.2;f.a+=(ta-f.a)*.25;const ca=Math.cos(-f.a),sa=Math.sin(-f.a);

/* ---------------------------- photobooth ---------------------------- */
function composeShot(){
  const W=Math.round(Math.min(1800,innerWidth*Math.min(2,devicePixelRatio||1))),sc=W/innerWidth,H=Math.round(innerHeight*sc);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#07060B';g.fillRect(0,0,W,H);
  const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;
  g.save();g.translate(W,0);g.scale(-1,1);g.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);g.restore();
  g.drawImage(renderer.domElement,0,0,W,H);
  const gr=g.createLinearGradient(0,H*.62,0,H);gr.addColorStop(0,'rgba(7,6,11,0)');gr.addColorStop(1,'rgba(7,6,11,.82)');g.fillStyle=gr;g.fillRect(0,H*.6,W,H*.4);
  const m=Math.min(W,H);g.textAlign='center';g.textBaseline='alphabetic';g.shadowColor='rgba(255,126,179,.6)';g.shadowBlur=m*.03;
  g.fillStyle='#FFF7FA';g.font=`italic 300 ${Math.round(m*.085)}px Fraunces, Georgia, serif`;g.fillText(COPY.stamp1,W/2,H-m*.1);
  g.shadowBlur=0;g.fillStyle='rgba(255,198,218,.92)';g.font=`500 ${Math.round(m*.026)}px Inter, sans-serif`;g.fillText(COPY.stamp2.toUpperCase(),W/2,H-m*.045);
  g.textAlign='right';g.fillStyle='rgba(255,247,250,.55)';g.font=`italic 300 ${Math.round(m*.022)}px Fraunces, Georgia, serif`;g.fillText(COPY.stamp3,W-m*.03,H-m*.018);
  return c}
function saveCanvas(c){c.toBlob(async b=>{if(!b)return;const file=new File([b],'chip-21.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'For Chip ✦'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chip-21.jpg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)},'image/jpeg',.92)}

/* ------------------------------- loop ------------------------------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  VH=2*60*Math.tan(THREE.MathUtils.degToRad(25));VW=VH*camera.aspect;uni.uScale.value=innerHeight*PR*.5;if(composer)composer.setSize(innerWidth,innerHeight);trailResize()}
addEventListener('resize',()=>{resize();if(S&&S.placeFlames)S.placeFlames()});resize();
let tp=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-tp)/1000);tp=now;st+=dt;uni.uTime.value=now*.001;
  readHands();gestures(dt);heartGesture(dt);if(S.update)S.update(dt);
  const t=now*.001,img=uni.uImg.value,hf=1-.55*img,fr=Math.min(3,dt*60),dmp=Math.pow(DAMP,fr),cl=1-Math.pow(.95,fr),Kf=K*fr;
  for(let i=0;i<N;i++){const j=i*3;const x=pos[j],y=pos[j+1],z=pos[j+2];
    let ax=(tgt[j]-x)*Kf,ay=(tgt[j+1]-y)*Kf,az=(tgt[j+2]-z)*Kf;
    if(swirl){ax-=y*swirl*.004*fr;ay+=x*swirl*.004*fr}
    for(let h=0;h<hands.length;h++){const H=hands[h];if(H.fist||H.pinch)continue;const dx=x-H.wx,dy=y-H.wy,d2=dx*dx+dy*dy;
      if(d2<36){const d=Math.sqrt(d2)+.3,f=(1-d/6)*.55*hf*fr;ax+=dx/d*f-dy/d*f*.9;ay+=dy/d*f+dx/d*f*.9}}
    ax+=Math.sin(t*.7+seed[i]*40)*.004*hf*fr;ay+=Math.cos(t*.6+seed[i]*30)*.004*hf*fr;
    vel[j]=(vel[j]+ax)*dmp;vel[j+1]=(vel[j+1]+ay)*dmp;vel[j+2]=(vel[j+2]+az)*dmp;
    pos[j]=x+vel[j]*fr;pos[j+1]=y+vel[j+1]*fr;pos[j+2]=z+vel[j+2]*fr;
    col[j]+=(tcol[j]-col[j])*cl;col[j+1]+=(tcol[j+1]-col[j+1])*cl;col[j+2]+=(tcol[j+2]-col[j+2])*cl}
  geo.attributes.position.needsUpdate=true;geo.attributes.aColor.needsUpdate=true;
  uni.uImg.value+=(modeImg-uni.uImg.value)*(1-Math.pow(.92,fr));uni.uOpacity.value+=(opT-uni.uOpacity.value)*(1-Math.pow(.94,fr));bloomCur+=(bloomBase-bloomCur)*(1-Math.pow(.95,fr));
  const h=hands[0];const rx=h?(h.sx/innerWidth-.5)*.08:0,ry=h?(h.sy/innerHeight-.5)*.06:0;

  drawTrail();
  if(composer&&!boothOn){uni.uLin.value=1;bloom.strength=bloomCur*(1-.72*uni.uImg.value);composer.render()}else{uni.uLin.value=0;renderer.render(scene,camera)}
  if(wantShot){wantShot=false;S.shot&&S.shot()}
  requestAnimationFrame(loop)}

if(!isMobile)(async()=>{try{
  const [{EffectComposer},{RenderPass},{UnrealBloomPass}]=await Promise.all([import('three/addons/postprocessing/EffectComposer.js'),import('three/addons/postprocessing/RenderPass.js'),import('three/addons/postprocessing/UnrealBloomPass.js')]);
  const c=new EffectComposer(renderer);c.setPixelRatio(PR);c.addPass(new RenderPass(scene,camera));
  const b=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.62,.42,.32);c.addPass(b);c.setSize(innerWidth,innerHeight);

async function begin(useCam){
  const camP=useCam?startCamera():Promise.resolve(false);
  sfx.init();

  if(useCam)await Promise.race([camP,new Promise(r=>setTimeout(r,12000))]);else status(COPY.stTap,3500);
