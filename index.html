  bloom=b;composer=c;CLEAR=0x000000;if(!boothOn)renderer.setClearColor(CLEAR,1);log('bloom on')}catch(e){console.warn('[chip] bloom off',e)}})();

async function begin(useCam){
  const camP=useCam?startCamera():Promise.resolve(false);
  sfx.init();
  const intro=$('intro');intro.style.opacity=0;intro.style.pointerEvents='none';setTimeout(()=>intro.remove(),1400);
  $('hud').classList.add('on');camSettled=!useCam;camP.finally(()=>{camSettled=true});
  const fontsP=document.fonts?Promise.race([Promise.all(['300 100px Fraunces','italic 300 100px Fraunces','400 100px Fraunces','italic 400 100px Fraunces','600 124px Fraunces'].map(f=>document.fonts.load(f,'Chào công chúa Sinh nhật vui nha ơưữệạảầ 21'))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}):Promise.resolve();
  if(useCam)await Promise.race([camP,new Promise(r=>setTimeout(r,1500))]);else status(COPY.stTap,3500);
  await fontsP;
  const q=new URLSearchParams(location.search).get('scene');const qi=q==null?0:(isNaN(+q)?scenes.findIndex(s=>s.name===q):+q);
  go(Math.max(0,qi));
}
$('goCam').onclick=e=>{e.stopPropagation();$('goCam').textContent='đang mở…';$('goCam').disabled=true;begin(true)};
$('goTap').onclick=e=>{e.stopPropagation();begin(false)};
</script>
